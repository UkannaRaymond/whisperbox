openapi: 3.1.0
info:
  title: WhisperBox API
  version: "1.0"
  description: >
    REST API for WhisperBox, a zero-knowledge end-to-end encrypted messaging
    platform. The server only ever stores ciphertext, wrapped per-device
    message keys, and metadata — plaintext message content is never sent to
    or seen by the API.
servers:
  - url: /v1
    description: Version 1

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Users
  - name: Sessions
  - name: Conversations
  - name: Messages
  - name: Attachments
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user and device
      description: >
        On success, sets an HttpOnly `refresh_token` cookie (scoped to
        `/api/v1/auth`) plus a readable `csrf_token` cookie. The response
        body only ever contains the access token and user profile — the
        refresh token itself is never exposed to JavaScript or returned in
        JSON. Rate-limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`refresh_token` (HttpOnly) and `csrf_token` cookies."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate with email + password, registering the calling device
      description: >
        Registers/reuses the calling device (matched by `devicePublicKey`)
        and enforces a single active session per device — logging in again
        on the same device revokes that device's previous session. Sets the
        same `refresh_token` / `csrf_token` cookies as register. Rate-limited
        per (IP, email); repeated failed attempts on the account itself also
        trigger account lockout (`423`) regardless of source IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "`refresh_token` (HttpOnly) and `csrf_token` cookies."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "423":
          $ref: "#/components/responses/AccountLockedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange the refresh token cookie for a new access/refresh token pair
      description: >
        Reads the refresh token from the HttpOnly `refresh_token` cookie
        (no request body) and requires the `X-CSRF-Token` header to match
        the readable `csrf_token` cookie (double-submit CSRF protection).
        The old refresh token is revoked and a new pair is issued
        (rotation) under the same underlying session.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: New token pair issued; new cookies set
          headers:
            Set-Cookie:
              schema: { type: string }
              description: "Rotated `refresh_token` (HttpOnly) and `csrf_token` cookies."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      accessToken: { type: string }
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/RateLimitedError"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current device's refresh token and session
      description: >
        Reads the refresh token from the HttpOnly cookie (no request body),
        requires the `X-CSRF-Token` header, revokes that session/token, and
        clears both cookies. For "logout everywhere" use `DELETE /sessions`
        instead.
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "204":
          description: Logged out; cookies cleared
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /users/me:
    get:
      tags: [Users]
      summary: Get the current authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      tags: [Users]
      summary: Update the current authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations the current user belongs to
      parameters:
        - $ref: "#/components/parameters/Take"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [Conversations]
      summary: Create a direct or group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created (or existing DIRECT conversation returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get a single conversation by id
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /conversations/{id}/messages:
    get:
      tags: [Messages]
      summary: List messages in a conversation (newest first, cursor-paginated)
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/Take"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /messages:
    post:
      tags: [Messages]
      summary: Send an encrypted message
      description: >
        `ciphertext` must already be encrypted client-side. `encryptedKeys`
        provides the message's symmetric key wrapped separately for every
        recipient device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /messages/{id}:
    patch:
      tags: [Messages]
      summary: Edit a message's ciphertext, or pin/unpin it
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMessageRequest"
      responses:
        "200":
          description: Updated message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Messages]
      summary: Delete a message for everyone
      description: >
        Soft-deletes the message and blanks its stored ciphertext. The row
        itself is never hard-deleted by this endpoint.
      parameters:
        - $ref: "#/components/parameters/MessageId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /attachments:
    post:
      tags: [Attachments]
      summary: Register an encrypted attachment already uploaded to object storage
      description: >
        File bytes are encrypted client-side and uploaded directly to
        Cloudflare R2 by the client; this endpoint only records the
        resulting object's metadata against a message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentRequest"
      responses:
        "201":
          description: Attachment registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /attachments/{id}:
    get:
      tags: [Attachments]
      summary: Get attachment metadata by id
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentEnvelope"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /sessions:
    get:
      tags: [Sessions]
      summary: List the caller's active sessions (logged-in devices)
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Sessions]
      summary: Logout everywhere — revoke every session and refresh token for the caller
      responses:
        "204":
          description: All sessions revoked
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /sessions/{id}:
    delete:
      tags: [Sessions]
      summary: Revoke a single session — remote logout of one device
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /admin/users:
    get:
      tags: [Admin]
      summary: List all users (admin only)
      description: >
        Requires the caller's access token to carry the `ADMIN` role.
        Minimal demonstration endpoint for the `requireAdmin` guard — not a
        complete admin panel API.
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the readable `csrf_token` cookie value (double-submit CSRF protection).
      schema: { type: string }
    Take:
      name: take
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details: [{ path: "email", message: "Must be a valid email address" }]
    UnauthorizedError:
      description: Missing, invalid, or expired credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error: { code: UNAUTHORIZED, message: "Invalid access token" }
    ForbiddenError:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error: { code: FORBIDDEN, message: "You are not a member of this conversation" }
    NotFoundError:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error: { code: NOT_FOUND, message: 'Message with id "..." was not found' }
    ConflictError:
      description: Resource already exists / conflicts with current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error: { code: CONFLICT, message: "An account with this email already exists" }
    AccountLockedError:
      description: Account temporarily locked after repeated failed login attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error:
              {
                code: ACCOUNT_LOCKED,
                message: "Too many failed login attempts. Try again after ...",
              }
    RateLimitedError:
      description: Too many requests — see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            success: false
            error:
              { code: RATE_LIMITED, message: "Too many login attempts, please try again later" }

  schemas:
    ApiError:
      type: object
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
      required: [success, error]

    RegisterRequest:
      type: object
      required: [username, email, password, devicePublicKey]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        displayName: { type: string, maxLength: 64 }
        deviceName: { type: string, maxLength: 64, default: "Unknown device" }
        devicePublicKey:
          type: string
          description: Public key for this device, used for message key wrapping.

    LoginRequest:
      type: object
      required: [email, password, devicePublicKey]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceName: { type: string, maxLength: 64, default: "Unknown device" }
        devicePublicKey: { type: string }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        status: { type: string, enum: [ONLINE, OFFLINE, AWAY] }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UserEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: "#/components/schemas/User"

    UpdateMeRequest:
      type: object
      description: At least one field must be provided.
      properties:
        displayName: { type: string, maxLength: 64 }
        avatarUrl: { type: string, format: uri }
        bio: { type: string, maxLength: 280 }

    AuthEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            accessToken: { type: string }
            user:
              $ref: "#/components/schemas/User"

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DIRECT, GROUP] }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        createdById: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ConversationEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: "#/components/schemas/Conversation"

    CreateConversationRequest:
      type: object
      required: [type, memberIds]
      properties:
        type: { type: string, enum: [DIRECT, GROUP] }
        name:
          type: string
          maxLength: 100
          description: Required when type is GROUP.
        description: { type: string, maxLength: 500 }
        avatarUrl: { type: string, format: uri }
        memberIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
          description: For DIRECT conversations, exactly one other member id.

    EncryptedKey:
      type: object
      required: [recipientDeviceId, encryptedKey]
      properties:
        recipientDeviceId: { type: string, format: uuid }
        encryptedKey:
          type: string
          description: The message's symmetric key, wrapped for this device's public key.

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        type: { type: string, enum: [TEXT, IMAGE, VIDEO, AUDIO, FILE, VOICE_NOTE, SYSTEM] }
        ciphertext:
          type: string
          description: Opaque ciphertext. Empty string if deletedForEveryone is true.
        replyToId: { type: string, format: uuid, nullable: true }
        isPinned: { type: boolean }
        isEdited: { type: boolean }
        editedAt: { type: string, format: date-time, nullable: true }
        deletedForEveryone: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MessageEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: "#/components/schemas/Message"

    CreateMessageRequest:
      type: object
      required: [conversationId, ciphertext, encryptedKeys]
      properties:
        conversationId: { type: string, format: uuid }
        type:
          type: string
          enum: [TEXT, IMAGE, VIDEO, AUDIO, FILE, VOICE_NOTE, SYSTEM]
          default: TEXT
        ciphertext: { type: string }
        replyToId: { type: string, format: uuid }
        encryptedKeys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EncryptedKey"

    UpdateMessageRequest:
      type: object
      description: At least one field must be provided. Editing ciphertext is sender-only.
      properties:
        ciphertext: { type: string }
        isPinned: { type: boolean }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        url: { type: string, format: uri }
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        checksum: { type: string, nullable: true }
        thumbnailUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    AttachmentEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: "#/components/schemas/Attachment"

    CreateAttachmentRequest:
      type: object
      required: [messageId, url, fileName, mimeType, size]
      properties:
        messageId: { type: string, format: uuid }
        url: { type: string, format: uri }
        fileName: { type: string, maxLength: 255 }
        mimeType: { type: string, maxLength: 127 }
        size: { type: integer, minimum: 1, maximum: 524288000 }
        checksum: { type: string }
        thumbnailUrl: { type: string, format: uri }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, nullable: true }
        deviceName: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        isCurrent:
          type: boolean
          description: True if this session belongs to the device making the current request.
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
